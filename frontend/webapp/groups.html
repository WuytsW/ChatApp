<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>My Groups</title>
  <script src="js/groups.js" defer></script>
</head>
<body>
  <h1>📚 My Groups</h1>

  <button onclick="window.location.href='main.html'">⬅ Back</button>

  <div id="groups"></div>

  <h2>💬 Send Group Message</h2>
  <form id="sendGroupMessageForm">
    <label>Group ID:</label>
    <input type="number" id="groupId" required />
    <br />
    <label>Message:</label>
    <textarea id="groupContent" required></textarea>
    <br />
    <button type="submit">Send</button>
  </form>
</body>
</html>
