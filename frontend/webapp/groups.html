<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My Groups - ChatApp</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="css/style.css" />
  <script src="js/groups.js" defer></script>
</head>
<body>
  <div class="page">
    <header class="top-bar">
      <div class="brand">
        <span class="brand-mark">💬</span>
        <span class="brand-name">ChatApp</span>
      </div>
      <button class="button ghost" onclick="window.location.href='main.html'">⬅ Back</button>
    </header>

    <main class="dashboard">
      <section class="panel">
        <h1>My Groups</h1>
        <p class="muted">Manage your active spaces and conversations.</p>
        <div id="groups" class="group-list"></div>
      </section>

      <section class="panel">
        <h2>Send Group Message</h2>
        <p class="muted">Update everyone in a single post.</p>
        <form id="sendGroupMessageForm" class="form">
          <label class="input-group">
            <span>Group ID</span>
            <input type="number" id="groupId" placeholder="e.g. 204" required />
          </label>
          <label class="input-group">
            <span>Message</span>
            <textarea id="groupContent" placeholder="Share the latest with your group" required></textarea>
          </label>
          <button type="submit" class="button primary">Send message</button>
        </form>
      </section>
    </main>
  </div>
</body>
</html>
