<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ChatApp – Home</title>
  <link rel="stylesheet" href="styles.css"/>
</head>
<body>
  <header class="topbar">
    <div class="brand">ChatApp</div>
    <div class="spacer"></div>
    <button id="logout-btn" class="btn small">Logout</button>
  </header>

  <main class="container grid-2">
    <section class="card">
      <h2>Direct Messages</h2>
      <div id="dm-threads" class="list"></div>
    </section>

    <section class="card">
      <h2>My Groups</h2>
      <div id="groups" class="list"></div>
      <div class="muted mt-8 small">Tip: Click a group to open it.</div>
    </section>
  </main>

  <footer class="footer muted small">© ChatApp</footer>

  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
