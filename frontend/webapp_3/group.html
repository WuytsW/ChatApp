<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ChatApp – Group</title>
  <link rel="stylesheet" href="styles.css"/>
</head>
<body>
  <header class="topbar">
    <a href="main.html" class="btn small">← Back</a>
    <div id="group-title" class="brand"></div>
    <div class="spacer"></div>
    <button id="logout-btn" class="btn small">Logout</button>
  </header>

  <main class="container grid-2">
    <section class="card">
      <h2>Members</h2>
      <ul id="members" class="list"></ul>

      <h3 class="mt-16">Add Member</h3>
      <form id="add-member-form" class="inline-form">
        <input type="text" name="member_name" placeholder="username to add" required />
        <button type="submit" class="btn small">Add</button>
      </form>
      <p id="add-member-error" class="error small"></p>
    </section>

    <section class="card chat">
      <div id="messages" class="messages"></div>
      <form id="send-group-msg-form" class="send-form">
        <input type="text" name="content" placeholder="Write a message..." required />
        <button type="submit" class="btn primary">Send</button>
      </form>
      <p id="send-error" class="error small"></p>
    </section>
  </main>

  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/group.js"></script>
</body>
</html>
