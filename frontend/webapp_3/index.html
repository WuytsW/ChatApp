<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ChatApp – Login / Register</title>
  <link rel="stylesheet" href="styles.css"/>
</head>
<body class="centered">
  <div class="card w-400">
    <h1 class="mb-16">ChatApp</h1>

    <div class="tabs">
      <button id="tab-login" class="tab active">Login</button>
      <button id="tab-register" class="tab">Register</button>
    </div>

    <form id="login-form" class="form">
      <label>Email or Username</label>
      <input type="text" name="email_or_password" placeholder="email or username" required />
      <label>Password</label>
      <input type="password" name="password" placeholder="password" required />
      <button type="submit" class="btn primary w-full">Login</button>
      <p id="login-error" class="error"></p>
    </form>

    <form id="register-form" class="form hidden">
      <label>Username</label>
      <input type="text" name="username" placeholder="username" required />
      <label>Email</label>
      <input type="email" name="email" placeholder="email@example.com" required />
      <label>Password</label>
      <input type="password" name="password" placeholder="password" required />
      <button type="submit" class="btn w-full">Register</button>
      <p id="register-error" class="error"></p>
    </form>
  </div>

  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
