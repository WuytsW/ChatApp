version: "3.8"

services:
  mysql:
    image: mysql:8
    container_name: chatapp-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: chatapp
      MYSQL_USER: chatuser
      MYSQL_PASSWORD: chatpass
    ports:
      - "3306:3306"

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: chatapp-phpmyadmin
    restart: always
    environment:
      PMA_HOST: mysql
      PMA_USER: chatuser
      PMA_PASSWORD: chatpass
    ports:
      - "8081:80"
